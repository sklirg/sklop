name: Publish

on:
  push:
    branches: ['main']

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: ko-build/setup-ko@v0.8
      - run: ko build -B ./cmd/sklop
