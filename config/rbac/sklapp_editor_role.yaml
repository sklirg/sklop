# This rule is not used by the project sklop itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the things.sklirg.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sklop
    app.kubernetes.io/managed-by: kustomize
  name: sklapp-editor-role
rules:
- apiGroups:
  - things.sklirg.io
  resources:
  - sklapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - things.sklirg.io
  resources:
  - sklapps/status
  verbs:
  - get
